name: Conformance

# Prove that the repository this project publishes is one a real F-Droid client
# can actually consume.
#
# The daily update job deliberately has no Python dependencies, so this workflow
# exists to install fdroidserver - the reference implementation - in a throwaway
# virtualenv and run the conformance suite against it. It also checks the
# redirecting front-end, which is what lets clients that cannot follow mirrors
# install the app at all.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday morning. A slow belt-and-braces check of the live site.
    - cron: '41 6 * * 1'
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Published repository address to check (blank = derive it)'
        type: string
        default: ''

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run the test suite
        run: python3 -m unittest discover -s tests -v

  worker:
    name: Redirector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the Worker tests
        # The Worker is plain JavaScript with no dependencies, so this needs
        # nothing but node's built-in test runner.
        run: node --test worker/

  conformance:
    name: Verify against fdroidserver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install fdroidserver
        # The reference implementation. Installed into a virtualenv so it can
        # never leak into the update job's dependency-free environment.
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/fdcheck"
          "$RUNNER_TEMP/fdcheck/bin/pip" install --quiet --disable-pip-version-check \
            "git+https://gitlab.com/fdroid/fdroidserver.git"
          "$RUNNER_TEMP/fdcheck/bin/python" -c "import fdroidserver; print('fdroidserver ready')"

      - name: Run the conformance suite
        # Builds a repository, signs it, serves it over HTTP and makes
        # fdroidserver download and verify it - including proving that a
        # tampered index is rejected.
        run: '"$RUNNER_TEMP/fdcheck/bin/python" -m unittest discover -s tests -v'

  published:
    name: Check the live site
    runs-on: ubuntu-latest
    # Only meaningful once a repository has actually been published.
    if: ${{ github.event_name == 'schedule' || inputs.repo_url != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fdroidserver
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/fdcheck"
          "$RUNNER_TEMP/fdcheck/bin/pip" install --quiet --disable-pip-version-check \
            "git+https://gitlab.com/fdroid/fdroidserver.git"

      - name: Work out the published address
        # Resolved once, so the two checks below cannot disagree about which
        # repository they are looking at.
        env:
          # An explicit input wins, so a one-off check against a staging
          # repository is possible. Otherwise the repository variable, which is
          # the address users were actually told to add. Deriving the Pages
          # address here instead would check something nobody uses, since a
          # redirector is what makes the repository installable at all.
          REPO_URL_INPUT: ${{ inputs.repo_url }}
          REPO_URL_VARIABLE: ${{ vars.REPO_URL }}
        run: |
          set -euo pipefail

          address="${REPO_URL_INPUT:-${REPO_URL_VARIABLE:-}}"
          if [ -z "$address" ]; then
            owner="${GITHUB_REPOSITORY_OWNER,,}"
            name="${GITHUB_REPOSITORY#*/}"
            address="https://${owner}.github.io/${name}/fdroid/repo"
            echo "::warning::no REPO_URL variable set; falling back to the Pages"
            echo "::warning::address, which only the official F-Droid client can use."
          fi
          echo "published address: $address"
          echo "REPO_ADDRESS=$address" >> "$GITHUB_ENV"

      - name: Verify the published repository
        run: |
          set -euo pipefail
          address="$REPO_ADDRESS"

          # The fingerprint is public: the landing page displays it precisely so
          # that anyone can check what F-Droid was told to trust.
          fingerprint=$(curl -fsSL "${address%/fdroid/repo}/repo-info.json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["signerFingerprint"] or "")')

          if [ -z "$fingerprint" ]; then
            echo "::notice::no signing fingerprint published yet, nothing to verify"
            exit 0
          fi
          echo "checking $address against $fingerprint"
          "$RUNNER_TEMP/fdcheck/bin/python" -m bdon_fdroid verify \
            --repo-url "$address" --fingerprint "$fingerprint"

      - name: Check the redirector serves the APK
        # Deliberately not conditional. Skipping this when REDIRECTOR_URL is
        # unset is how a broken redirector sits there unnoticed: the job goes
        # green, the official client still works because it follows the mirror,
        # and only a user on Neo Store or Obtainium finds out. Same failure
        # class as a stale metadata cache passing CI.
        env:
          REDIRECTOR_URL: ${{ vars.REDIRECTOR_URL }}
        run: |
          set -euo pipefail

          if [ -z "$REDIRECTOR_URL" ]; then
            echo "::error::REDIRECTOR_URL is not set, so the redirector is unchecked."
            echo "::error::Neo Store and Obtainium cannot install the app without it."
            echo "::error::See docs/setup-github-actions-and-pages.md, step 5."
            exit 1
          fi

          # Request the APK through the published address, which is the URL a
          # client actually builds. A Pages address cannot redirect, so probing
          # the wrong host would pass while the address users hold is broken.
          address="$REPO_ADDRESS"

          # The APK name changes with every release, so discover it from the
          # live index rather than hardcoding it. curl rather than urllib:
          # Cloudflare answers 403 to urllib's default User-Agent, and this URL
          # is served by Cloudflare whenever a redirector is in use.
          apk=$(curl -fsSL "$address/index-v2.json" | python3 -c '
          import json, sys
          index = json.load(sys.stdin)
          versions = next(iter(index["packages"].values()))["versions"]
          print(next(iter(versions.values()))["file"]["name"].lstrip("/"))
          ')
          echo "checking that $address/$apk redirects to the publisher's CDN"

          location=$(curl -sS -o /dev/null -w '%{redirect_url}' "$address/$apk")

          if [ -z "$location" ]; then
            echo "::error::no redirect from $address/$apk. Clients that cannot"
            echo "::error::follow mirrors (Neo Store, Obtainium) cannot install the app."
            exit 1
          fi
          if [[ "$location" != *biligames.com* ]]; then
            echo "::error::redirect went to $location, expected the publisher's CDN"
            exit 1
          fi
          echo "redirects to $location"
