name: Update repository

# Check the publisher's website once a day. The APK is only downloaded when the
# download URL changes, so an ordinary run costs a few HTTP requests rather than
# hundreds of megabytes.
on:
  schedule:
    # 03:17 UTC daily. A slightly off-the-hour minute avoids the rush on
    # GitHub's scheduler, which is busiest on the hour.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force_download:
        description: 'Re-download the APK even if the cached hash looks current'
        type: boolean
        default: false
  # Lets another workflow (or a dependabot-style bot) trigger a check on demand.
  repository_dispatch:
    types: [refresh]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  update:
    name: Scrape, build, sign, publish
    runs-on: ubuntu-latest
    # A first run, or any run where the CDN hostname changed, downloads a
    # ~450 MB APK. Generous, because a timeout mid-download is wasted work.
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.build.outputs.changed }}
      version_name: ${{ steps.build.outputs.version_name }}
      version_code: ${{ steps.build.outputs.version_code }}
      fingerprint: ${{ steps.build.outputs.fingerprint }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The index is signed with the JDK's jarsigner. ubuntu-latest already
      # ships one, but pinning setup-java makes the requirement explicit and
      # guards against a runner image dropping it.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore the repository signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Run scripts/init-repo-key.sh"
            echo "::error::locally and add it under Settings -> Secrets -> Actions."
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.p12"
          echo "restored keystore ($(stat -c%s "$RUNNER_TEMP/keystore.p12") bytes)"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore.p12" >> "$GITHUB_ENV"

      - name: Work out the repository address
        id: address
        env:
          # Repository *variables* are not exposed as plain environment
          # variables: a bare $REPO_URL here is always empty, which silently
          # fell back to the Pages address and published a repository that
          # only the official F-Droid client could install from. It has to be
          # interpolated explicitly.
          REPO_URL_VARIABLE: ${{ vars.REPO_URL }}
          REDIRECTOR_URL: ${{ vars.REDIRECTOR_URL }}
        run: |
          set -euo pipefail

          if [ -n "$REDIRECTOR_URL" ] && [ -z "$REPO_URL_VARIABLE" ]; then
            echo "::error::REDIRECTOR_URL is set but REPO_URL is not."
            echo "::error::Publishing the GitHub Pages address would advertise a link"
            echo "::error::that fails in Neo Store and Obtainium, which cannot follow a"
            echo "::error::repository mirror. Set REPO_URL to"
            echo "::error::  $REDIRECTOR_URL/fdroid/repo"
            exit 1
          fi

          # An explicit address wins, so a custom domain, a renamed repository or
          # a redirector needs no workflow edit.
          address="$REPO_URL_VARIABLE"
          if [ -z "$address" ]; then
            owner="${GITHUB_REPOSITORY_OWNER,,}"
            name="${GITHUB_REPOSITORY#*/}"
            # The /fdroid/repo suffix is expected by several client features.
            address="https://${owner}.github.io/${name}/fdroid/repo"
            echo "::warning::no REPO_URL variable set; publishing the plain Pages"
            echo "::warning::address. Only the official F-Droid client can install from"
            echo "::warning::this; see docs/setup-github-actions-and-pages.md step 5."
          fi
          echo "Repository address: $address"
          echo "url=$address" >> "$GITHUB_OUTPUT"

      - name: Build the repository
        id: build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          REPO_KEYALIAS: ${{ secrets.REPO_KEYALIAS }}
          REPO_URL: ${{ steps.address.outputs.url }}
        run: |
          set -euo pipefail
          args=(build --state releases.json --deploy deploy --repo-url "$REPO_URL")
          if [ "${{ inputs.force_download }}" = "true" ]; then
            args+=(--force-download)
          fi
          python3 -m bdon_fdroid "${args[@]}"

          # Read the results out of the summary the build just wrote, rather
          # than re-deriving them from keytool and releases.json.
          eval "$(python3 - <<'PY'
          import json, shlex
          info = json.load(open("deploy/repo-info.json"))
          latest = info["latest"] or {}
          print(f"changed={'true' if info['changed'] else 'false'}")
          print(f"version_name={shlex.quote(str(latest.get('versionName', '')))}")
          print(f"version_code={shlex.quote(str(latest.get('versionCode', '')))}")
          print(f"fingerprint={shlex.quote(info['signerFingerprint'] or '')}")
          PY
          )"
          {
            echo "changed=$changed"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "fingerprint=$fingerprint"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### F-Droid repository updated"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Add this URL | \`$REPO_URL\` |"
            echo "| Key fingerprint | \`${fingerprint:-not signed}\` |"
            echo "| Latest version | $version_name (versionCode $version_code) |"
            echo ""
            echo "Users add the repository in F-Droid under Settings -> Repositories and"
            echo "should compare the fingerprint above with what the app displays."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the test suite
        run: python3 -m unittest discover -s tests

      - name: Run the redirector tests
        # The Worker is deployed once by hand and never touched by this
        # workflow, so its behaviour is only guarded by CI.
        run: node --test worker/

      - name: Commit the updated release history
        # The history is the cache that makes the next run cheap, and the
        # changelog for anyone watching this repository.
        #
        # lastChecked moves on every run by design, so diffing the whole file
        # made this commit on every single run and buried a genuine new release
        # in routine noise - four identical-looking "record release" commits in
        # a row. Only the release list itself is worth committing.
        run: |
          set -euo pipefail

          # A failing command in an `if` condition does not trip `set -e`, so
          # the comparison reports through its exit status: 0 means unchanged.
          if python3 - <<'PY'
          import json, subprocess, sys
          try:
              blob = subprocess.run(
                  ["git", "show", "HEAD:releases.json"],
                  capture_output=True, text=True, check=True,
              ).stdout
              previous = json.loads(blob).get("releases")
          except Exception:
              previous = None  # first run; nothing recorded yet
          current = json.load(open("releases.json")).get("releases")
          if previous == current:
              print("no new release; lastChecked moved but the history did not")
          sys.exit(0 if previous == current else 1)
          PY
          then
            echo "release history unchanged; not committing the timestamp alone"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.json
          git commit -m "chore: record release ${{ steps.build.outputs.version_name }}" \
                      -m "Automated by .github/workflows/update.yml"
          git push

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          # A single commit of history: every run replaces the site wholesale,
          # so keeping old commits would only bloat the branch.
          force_orphan: true
